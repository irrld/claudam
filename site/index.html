<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="book">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.4' stop-color='%236ef3ff'/%3E%3Cstop offset='1' stop-color='%238f7bff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Unbounded:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Set the theme before first paint.
  (() => {
    let theme;
    try { theme = localStorage.getItem('theme'); } catch {}
    document.documentElement.dataset.theme =
      theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  })();
</script>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#chapters">Skip to the chapters</a>

<div class="cosmos" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <svg class="flow" viewBox="0 0 1440 900" preserveAspectRatio="none">
    <defs>
      <linearGradient id="flow-g" x1="0" x2="1">
        <stop offset="0"/><stop offset=".5"/><stop offset="1"/>
      </linearGradient>
    </defs>
    <path d="M-120 690 C 280 500, 620 900, 1010 640 S 1500 380, 1580 450"/>
    <path d="M-120 740 C 300 570, 650 960, 1050 690 S 1520 430, 1580 510"/>
    <path d="M-120 210 C 240 90, 540 380, 920 250 S 1400 40, 1580 120"/>
  </svg>
  <div class="grain"></div>
</div>

<header class="topbar">
  <a class="brand" href="#top"><span class="brand-orb"></span><span class="brand-name">{{title}}</span></a>
  <span class="now"></span>
  <div class="actions">
    <button class="icon-btn" type="button" data-action="search" aria-label="Search the verses (Ctrl K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <button class="icon-btn" type="button" data-action="theme" aria-label="Toggle light and dark">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
    </button>
    <button class="icon-btn only-narrow" type="button" data-action="chapters" aria-label="Chapters" aria-expanded="false" aria-controls="rail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </div>
  <div class="progress"></div>
</header>

<main id="top">
  <section class="hero">
    <div class="orb" aria-hidden="true">
      <div class="orb-glow"></div>
      <div class="orb-core"></div>
      <div class="orb-ring r1"></div>
      <div class="orb-ring r2"></div>
      <div class="orb-ring r3"></div>
    </div>
    <p class="eyebrow">{{subtitle}}</p>
    <h1 class="title">{{title}}</h1>
    <div class="cta">
      <a class="btn btn-primary" href="#chapter-1">Begin the revelation</a>
      <button class="btn btn-glass" type="button" data-action="reveal">Receive a verse</button>
    </div>
    <figure class="revelation" hidden>
      <blockquote class="revelation-text"></blockquote>
      <figcaption><a class="revelation-ref"></a></figcaption>
    </figure>
  </section>

  <section class="preface panel">
{{preface}}
  </section>

  <div class="reader">
    <nav class="rail" id="rail" aria-label="Chapters">
      <p class="rail-label">Chapters</p>
      {{rail}}
    </nav>
    <div class="chapters" id="chapters">
{{chapters}}
    </div>
  </div>
</main>

<footer class="footer">
  <span class="brand-orb"></span>
  <p>Trained upon all things. Remembereth nothing.</p>
</footer>

<dialog class="oracle" aria-label="Search the verses">
  <div class="oracle-panel">
    <form method="dialog" class="oracle-form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" autocomplete="off" spellcheck="false" aria-label="Search the verses">
      <kbd>Esc</kbd>
    </form>
    <ol class="oracle-results"></ol>
  </div>
</dialog>

<div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
